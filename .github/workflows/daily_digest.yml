name: Daily Finance Econ Digest

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate digest
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ANALYSIS_LLM_API_BASE: ${{ secrets.ANALYSIS_LLM_API_BASE }}
          ANALYSIS_LLM_API_KEY: ${{ secrets.ANALYSIS_LLM_API_KEY }}
          ANALYSIS_LLM_MODEL: ${{ secrets.ANALYSIS_LLM_MODEL }}
        run: python -m src.digest

      - name: Send digest emails to subscribers
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.digest send-emails --subscribers-file data/subscribers.json --fallback-to "${MAIL_TO}"

      - name: Commit generated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --staged --quiet || git commit -m "chore: update daily finance digest"
          git push
